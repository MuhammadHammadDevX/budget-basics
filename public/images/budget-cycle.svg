<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">The monthly budget cycle</title><desc id="d">Five repeating steps: plan, track, review, adjust and save.</desc><rect width="800" height="500" rx="18" fill="#F6F9F7"/><text x="400" y="50" font-family="Verdana, Arial, sans-serif" font-size="26" fill="#17324D" text-anchor="middle" font-weight="bold">The monthly budget cycle</text><circle cx="400" cy="275" r="165" fill="none" stroke="#C9D6D0" stroke-width="6" stroke-dasharray="4 10"/><text x="400" y="269" font-family="Verdana, Arial, sans-serif" font-size="20" fill="#1B7F79" text-anchor="middle" font-weight="bold">Repeat</text><text x="400" y="293" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="normal">every month</text><circle cx="400" cy="110" r="58" fill="#fff" stroke="#1B7F79" stroke-width="4"/><text x="400.0" y="92.0" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#1B7F79" text-anchor="middle" font-weight="bold">1</text><text x="400.0" y="112.0" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#17324D" text-anchor="middle" font-weight="bold">Plan</text><text x="400.0" y="130.0" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">Set limits from</text><text x="400.0" y="143.0" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">your allowance</text><path d="M-8,-7 L8,0 L-8,7 Z" fill="#1B7F79" transform="translate(497,142) rotate(36)"/><circle cx="557" cy="224" r="58" fill="#fff" stroke="#17324D" stroke-width="4"/><text x="556.9243251887003" y="206.01219592813368" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#17324D" text-anchor="middle" font-weight="bold">2</text><text x="556.9243251887003" y="226.01219592813368" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#17324D" text-anchor="middle" font-weight="bold">Track</text><text x="556.9243251887003" y="244.01219592813368" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">Log every</text><text x="556.9243251887003" y="257.0121959281337" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">expense</text><path d="M-8,-7 L8,0 L-8,7 Z" fill="#17324D" transform="translate(557,326) rotate(108)"/><circle cx="497" cy="408" r="58" fill="#fff" stroke="#E8A317" stroke-width="4"/><text x="496.98456662825805" y="390.4878040718663" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#E8A317" text-anchor="middle" font-weight="bold">3</text><text x="496.98456662825805" y="410.4878040718663" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#17324D" text-anchor="middle" font-weight="bold">Review</text><text x="496.98456662825805" y="428.4878040718663" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">Compare plan</text><text x="496.98456662825805" y="441.4878040718663" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">vs. actual</text><path d="M-8,-7 L8,0 L-8,7 Z" fill="#E8A317" transform="translate(400,440) rotate(180)"/><circle cx="303" cy="408" r="58" fill="#fff" stroke="#1B7F79" stroke-width="4"/><text x="303.01543337174195" y="390.4878040718663" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#1B7F79" text-anchor="middle" font-weight="bold">4</text><text x="303.01543337174195" y="410.4878040718663" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#17324D" text-anchor="middle" font-weight="bold">Adjust</text><text x="303.01543337174195" y="428.4878040718663" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">Move money</text><text x="303.01543337174195" y="441.4878040718663" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">where needed</text><path d="M-8,-7 L8,0 L-8,7 Z" fill="#1B7F79" transform="translate(243,326) rotate(252)"/><circle cx="243" cy="224" r="58" fill="#fff" stroke="#17324D" stroke-width="4"/><text x="243.07567481129965" y="206.0121959281337" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#17324D" text-anchor="middle" font-weight="bold">5</text><text x="243.07567481129965" y="226.0121959281337" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#17324D" text-anchor="middle" font-weight="bold">Save</text><text x="243.07567481129965" y="244.0121959281337" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">Pay yourself</text><text x="243.07567481129965" y="257.0121959281337" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#17324D" text-anchor="middle" font-weight="normal">first</text><path d="M-8,-7 L8,0 L-8,7 Z" fill="#17324D" transform="translate(303,142) rotate(324)"/></svg>