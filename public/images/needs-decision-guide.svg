<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img" aria-labelledby="t d"><title id="t">Needs versus wants decision guide</title><desc id="d">A flowchart: if a purchase is essential, buy it from your needs budget. If not, wait 48 hours, then buy only if it still fits your wants budget; otherwise save the money.</desc><rect width="800" height="510" rx="18" fill="#F6F9F7"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#17324D"/></marker></defs><text x="400" y="48" font-family="Verdana, Arial, sans-serif" font-size="26" fill="#17324D" text-anchor="middle" font-weight="bold">Should I buy it now?</text><rect x="290" y="75" width="220" height="50" rx="12" fill="#fff" stroke="#17324D" stroke-width="2.5"/><text x="400.0" y="105.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">I want to buy something</text><line x1="400" y1="125" x2="400" y2="158" stroke="#17324D" stroke-width="2.5" marker-end="url(#ah)"/><rect x="270" y="160" width="260" height="60" rx="12" fill="#DCEEE7" stroke="#1B7F79" stroke-width="2.5"/><text x="400.0" y="185.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Is it essential right now?</text><text x="400.0" y="205.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="normal">food, rent, transport, books</text><line x1="270" y1="190" x2="165" y2="245" stroke="#1B7F79" stroke-width="2.5" marker-end="url(#ah)"/><text x="205" y="205" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#1B7F79" text-anchor="middle" font-weight="bold">Yes</text><line x1="530" y1="190" x2="635" y2="245" stroke="#E8A317" stroke-width="2.5" marker-end="url(#ah)"/><text x="595" y="205" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#E8A317" text-anchor="middle" font-weight="bold">No</text><rect x="40" y="248" width="250" height="70" rx="12" fill="#fff" stroke="#1B7F79" stroke-width="2.5"/><text x="165.0" y="278.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Need: buy it</text><text x="165.0" y="298.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="normal">from your needs budget</text><rect x="510" y="248" width="250" height="70" rx="12" fill="#FFF6E0" stroke="#E8A317" stroke-width="2.5"/><text x="635.0" y="278.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Want: wait 48 hours</text><text x="635.0" y="298.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="normal">then ask again</text><line x1="635" y1="318" x2="635" y2="352" stroke="#17324D" stroke-width="2.5" marker-end="url(#ah)"/><rect x="490" y="355" width="290" height="62" rx="12" fill="#fff" stroke="#17324D" stroke-width="2.5"/><text x="635.0" y="381.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Still want it and it fits</text><text x="635.0" y="401.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="normal">your wants budget?</text><line x1="560" y1="417" x2="470" y2="455" stroke="#1B7F79" stroke-width="2.5" marker-end="url(#ah)"/><text x="500" y="430" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#1B7F79" text-anchor="middle" font-weight="bold">Yes</text><line x1="710" y1="417" x2="710" y2="450" stroke="#B83A2E" stroke-width="2.5" marker-end="url(#ah)"/><text x="735" y="440" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#B83A2E" text-anchor="middle" font-weight="bold">No</text><rect x="330" y="455" width="200" height="36" rx="18" fill="#DCEEE7" stroke="#1B7F79" stroke-width="2.5"/><text x="430.0" y="478.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Buy it, guilt-free</text><rect x="600" y="452" width="190" height="40" rx="18" fill="#FBE9E6" stroke="#B83A2E" stroke-width="2.5"/><text x="695.0" y="477.0" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Skip it, save the money</text><text x="165" y="370" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#17324D" text-anchor="middle" font-weight="normal">Paying needs first keeps</text><text x="165" y="390" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#17324D" text-anchor="middle" font-weight="normal">bills and fees away.</text></svg>