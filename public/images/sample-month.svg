<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">A sample student month</title><desc id="d">A 500 dollar allowance split into rent 200, food 100, transport 40, books 30, wants 90 and savings 40.</desc><rect width="800" height="500" rx="18" fill="#F6F9F7"/><text x="400" y="48" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#17324D" text-anchor="middle" font-weight="bold">A sample student month: $500 allowance</text><rect x="60.0" y="110" width="272.0" height="70" fill="#1B7F79"/><text x="196.0" y="152" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">$200</text><rect x="332.0" y="110" width="136.0" height="70" fill="#2A9D8F"/><text x="400.0" y="152" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">$100</text><rect x="468.0" y="110" width="54.4" height="70" fill="#5FB3A9"/><text x="495.2" y="152" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">$40</text><rect x="522.4" y="110" width="40.8" height="70" fill="#8CC9BF"/><text x="542.8" y="152" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">$30</text><rect x="563.2" y="110" width="122.4" height="70" fill="#E8A317"/><text x="624.4" y="152" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">$90</text><rect x="685.6" y="110" width="54.4" height="70" fill="#17324D"/><text x="712.8" y="152" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">$40</text><rect x="100" y="212" width="24" height="24" rx="5" fill="#1B7F79"/><text x="136" y="230" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#17324D" text-anchor="start" font-weight="normal">Rent / hostel: $200 (40%)</text><rect x="430" y="212" width="24" height="24" rx="5" fill="#2A9D8F"/><text x="466" y="230" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#17324D" text-anchor="start" font-weight="normal">Food: $100 (20%)</text><rect x="100" y="272" width="24" height="24" rx="5" fill="#5FB3A9"/><text x="136" y="290" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#17324D" text-anchor="start" font-weight="normal">Transport: $40 (8%)</text><rect x="430" y="272" width="24" height="24" rx="5" fill="#8CC9BF"/><text x="466" y="290" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#17324D" text-anchor="start" font-weight="normal">Books: $30 (6%)</text><rect x="100" y="332" width="24" height="24" rx="5" fill="#E8A317"/><text x="136" y="350" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#17324D" text-anchor="start" font-weight="normal">Wants: $90 (18%)</text><rect x="430" y="332" width="24" height="24" rx="5" fill="#17324D"/><text x="466" y="350" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#17324D" text-anchor="start" font-weight="normal">Savings: $40 (8%)</text><text x="400" y="445" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Needs $370 (74%)   Wants $90 (18%)   Savings $40 (8%)</text><text x="400" y="470" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#17324D" text-anchor="middle" font-weight="normal">Sample values for learning only.</text></svg>