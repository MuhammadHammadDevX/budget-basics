<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d"><title id="t">Small expenses add up</title><desc id="d">Four dollars a day becomes 28 dollars a week, 120 dollars a month, 480 dollars a semester and 1,460 dollars a year.</desc><rect width="800" height="480" rx="18" fill="#F6F9F7"/><text x="400" y="48" font-family="Verdana, Arial, sans-serif" font-size="26" fill="#17324D" text-anchor="middle" font-weight="bold">Small expenses add up</text><text x="400" y="78" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="normal">A $4 snack or coffee every day, over time</text><circle cx="90" cy="270" r="18" fill="#1B7F79" opacity="0.92"/><text x="90" y="276" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">$4</text><text x="90" y="405" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Per day</text><circle cx="245" cy="270" r="24" fill="#1B7F79" opacity="0.92"/><text x="245" y="276" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">$28</text><text x="245" y="405" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Per week</text><circle cx="400" cy="270" r="35" fill="#17324D" opacity="0.92"/><text x="400" y="276" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">$120</text><text x="400" y="405" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Per month</text><circle cx="555" cy="270" r="56" fill="#17324D" opacity="0.92"/><text x="555" y="276" font-family="Verdana, Arial, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">$480</text><text x="555" y="405" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Per semester</text><circle cx="710" cy="270" r="87" fill="#E8A317" opacity="0.92"/><text x="710" y="276" font-family="Verdana, Arial, sans-serif" font-size="21" fill="#fff" text-anchor="middle" font-weight="bold">$1,460</text><text x="710" y="405" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#17324D" text-anchor="middle" font-weight="bold">Per year</text><text x="400" y="450" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#17324D" text-anchor="middle" font-weight="normal">$1,460 a year could cover a semester of textbooks or start an emergency fund.</text></svg>